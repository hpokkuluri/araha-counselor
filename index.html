<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="ARAHA Counselor by Arahasoft. A private, offline student counselor. Your notes stay on this device.">
<meta name="theme-color" content="#0E1B3D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ARAHA Counselor">
<title>ARAHA Counselor by Arahasoft</title>
<script>
/* Apply the saved theme before first paint. Keep in sync with src/theme.js. */
(function () {
  var choice = "auto";
  try { choice = localStorage.getItem("ac-theme") || "auto"; } catch (e) {}
  if (choice !== "light" && choice !== "dark") choice = "auto";
  var dark = choice === "dark" || (choice === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
  var root = document.documentElement;
  root.setAttribute("data-theme-choice", choice);
  root.setAttribute("data-theme", dark ? "dark" : "light");
  root.style.colorScheme = dark ? "dark" : "light";
})();
</script>
<link rel="preload" href="%BASE_URL%fonts/manrope-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="%BASE_URL%fonts/instrument-serif-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="%BASE_URL%fonts/instrument-serif-latin-400-italic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="%BASE_URL%fonts/fonts.css">
<link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png">
<style>
  html,body{margin:0;height:100%;background:#0E1B3D}
  body:not(.app-ready){background:#0E1B3D}
  #splash{position:fixed;inset:0;z-index:100;background:radial-gradient(70% 50% at 50% 45%,#16285A,#0E1B3D 70%);display:grid;place-items:center;color:#fff;transition:opacity .55s ease}
  #splash.out{opacity:0;pointer-events:none}
  .sp-in{display:flex;flex-direction:column;align-items:center;max-width:100%}
  .sp-logo{width:110px;height:110px;overflow:visible}
  .sp-h{fill:none;stroke:#E2262E;stroke-width:2;stroke-dasharray:80;stroke-dashoffset:80;animation:spDraw .9s cubic-bezier(.6,0,.3,1) forwards}
  .sp-h.h2{animation-delay:.2s}.sp-h.h3{animation-delay:.4s}
  .sp-t{fill:#fff;font-family:Manrope,sans-serif;font-weight:800;text-anchor:middle;opacity:0;animation:spFade .4s ease forwards}
  .sp-t.t1{animation-delay:.75s}.sp-t.t2{animation-delay:.88s}.sp-t.t3{animation-delay:1s}
  .sp-word sup{font-size:.55em;letter-spacing:0;margin-left:-.3em;vertical-align:.9em;font-weight:600}
  .sp-word{margin-top:22px;font-family:Manrope,sans-serif;font-weight:800;font-size:1.05rem;letter-spacing:.9em;padding-left:.9em;opacity:0;animation:spWord 1.1s cubic-bezier(.2,.8,.2,1) 1.1s forwards}
  .sp-app{margin-top:26px;font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:clamp(1.55rem,6.6vw,2.3rem);line-height:1.05;opacity:0;transform:translateY(8px);animation:spUp .7s ease 1.85s forwards;text-align:center;white-space:nowrap}
  .sp-app em{color:#F2B33D;font-style:italic}
  .sp-line{height:2px;width:0;margin-top:10px;background:linear-gradient(90deg,transparent,#F2B33D,transparent);animation:spLine .8s ease 2.2s forwards}
  @keyframes spDraw{to{stroke-dashoffset:0}}
  @keyframes spFade{to{opacity:1}}
  @keyframes spWord{from{opacity:0;letter-spacing:1.6em}to{opacity:1;letter-spacing:.42em;padding-left:.42em}}
  @keyframes spUp{to{opacity:1;transform:none}}
  @keyframes spLine{to{width:160px}}
  #splash{animation:spGone .5s ease 4.4s forwards}
  @keyframes spGone{to{opacity:0;visibility:hidden}}
  .skip-splash{position:absolute;left:16px;bottom:calc(env(safe-area-inset-bottom) + 16px);border:0;background:transparent;color:rgba(255,255,255,.72);font-family:Manrope,sans-serif;font-weight:700;font-size:.85rem;padding:8px}
  @media (prefers-reduced-motion:reduce){
    .sp-h,.sp-t,.sp-word,.sp-app,.sp-line{animation:none!important;opacity:1;stroke-dashoffset:0;transform:none}
    .sp-word{letter-spacing:.42em;padding-left:.42em}
    .sp-line{width:160px}
    #splash{animation:none}
  }
</style>
</head>
<body class="splashing">
<div id="splash" data-testid="splash" aria-hidden="true">
  <div class="sp-in">
    <!-- Keep this mark in sync with src/logo.js. It is the Interview Edge logo. -->
    <svg class="sp-logo" viewBox="0 0 64 64" aria-hidden="true">
      <polygon class="sp-h h1" points="27.0,32.0 21.0,42.4 9.0,42.4 3.0,32.0 9.0,21.6 21.0,21.6"></polygon>
      <polygon class="sp-h h2" points="48.0,20.0 42.0,30.4 30.0,30.4 24.0,20.0 30.0,9.6 42.0,9.6"></polygon>
      <polygon class="sp-h h3" points="48.0,44.0 42.0,54.4 30.0,54.4 24.0,44.0 30.0,33.6 42.0,33.6"></polygon>
      <text class="sp-t t1" x="15" y="37" font-size="13">a</text>
      <text class="sp-t t2" x="36" y="25" font-size="12">ra</text>
      <text class="sp-t t3" x="36" y="49" font-size="12">ha</text>
    </svg>
    <div class="sp-word">ARAHASOFT<sup>™</sup></div>
    <div class="sp-app">ARAHA <em>Counselor</em></div>
    <div class="sp-line"></div>
  </div>
  <button class="skip-splash" type="button" data-testid="skip-splash">Skip</button>
</div>
<div id="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script type="module" src="/src/main.js"></script>
<noscript>
  <p style="color:#fff;font-family:sans-serif;padding:24px">ARAHA Counselor needs JavaScript. It still runs entirely on your device.</p>
</noscript>
</body>
</html>
